spring:
  application:
    name: shecancode-attendance-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shecancode}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@igirerwanda.org}
    password: ${MAIL_PASSWORD:pdep moky fhbd usgt}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: attendance-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  # Base URL of the (external) frontend. Activation links are built as
  # ${app.frontend-url}/activate?token=<TOKEN>
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  name: SheCanCODE
  jwt:
    secret: change-this-to-a-long-secure-secret-key-at-least-32-bytes
    expiration-ms: 86400000
  mail:
    # Gmail rejects a From that isn't the authenticated account (or a verified
    # alias), so default the From to MAIL_USERNAME unless MAIL_FROM is set.
    from-address: ${MAIL_FROM:${MAIL_USERNAME:no-reply@shecancode.com}}
  activation:
    token-expiry-hours: ${ACTIVATION_TOKEN_EXPIRY_HOURS:48}
    # Minimum seconds between successive resend requests for the same account
    resend-cooldown-seconds: ${ACTIVATION_RESEND_COOLDOWN_SECONDS:60}

server:
  port: 8081
  # Railway (and most PaaS proxies) terminate TLS and forward requests to the
  # app over plain HTTP, setting X-Forwarded-Proto: https. Honoring these headers
  # makes Spring/springdoc generate https:// URLs (e.g. the Swagger "servers"
  # entry) instead of http://, avoiding mixed-content "Failed to fetch" errors.
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: DEBUG
    com.shecancode.attendence.Attendence.Kafka: DEBUG