spring:
  application:
    name: shecancode-attendance-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shecancode}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: attendance-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  # Base URL of the (external) frontend. Activation links are built as
  # ${app.frontend-url}/activate?token=<TOKEN>
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  name: SheCanCODE
  jwt:
    secret: change-this-to-a-long-secure-secret-key-at-least-32-bytes
    expiration-ms: 86400000
  mail:
    from-address: ${MAIL_FROM:no-reply@shecancode.com}
  activation:
    token-expiry-hours: ${ACTIVATION_TOKEN_EXPIRY_HOURS:48}
    # Minimum seconds between successive resend requests for the same account
    resend-cooldown-seconds: ${ACTIVATION_RESEND_COOLDOWN_SECONDS:60}

server:
  port: 8081

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: DEBUG
    com.shecancode.attendence.Attendence.Kafka: DEBUG