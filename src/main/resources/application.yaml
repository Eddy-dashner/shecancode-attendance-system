spring:
  application:
    name: shecancode-attendance-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shecancode}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: attendance-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  # Base URL of the (external) frontend. Activation links are built as
  # ${app.frontend-url}/activate?token=<TOKEN>
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  name: SheCanCODE
  jwt:
    secret: change-this-to-a-long-secure-secret-key-at-least-32-bytes
    # Access token: short-lived, sent on every request.
    access-token-expiration-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    # Refresh token: long-lived, only sent to POST /api/v1/auth/refresh. Single-use
    # (rotated on every refresh) and revocable server-side (see refresh_token table).
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
  mail:
    # Sent via the Brevo transactional email HTTP API (not SMTP) since Railway's
    # free/trial plans block outbound SMTP ports. from-address must be a sender
    # verified in Brevo (Senders & IP > Senders).
    from-address: ${MAIL_FROM:no-reply@igirerwanda.org}
    from-name: ${MAIL_FROM_NAME:SheCanCODE}
    brevo-api-key: ${BREVO_API_KEY:}
  attendance:
    # Timezone used to decide what "today" is for attendance.
    timezone: ${ATTENDANCE_TIMEZONE:Africa/Kigali}
  activation:
    token-expiry-hours: ${ACTIVATION_TOKEN_EXPIRY_HOURS:48}
    # Minimum seconds between successive resend requests for the same account
    resend-cooldown-seconds: ${ACTIVATION_RESEND_COOLDOWN_SECONDS:60}

server:
  port: 8081
  # Railway (and most PaaS proxies) terminate TLS and forward requests to the
  # app over plain HTTP, setting X-Forwarded-Proto: https. Honoring these headers
  # makes Spring/springdoc generate https:// URLs (e.g. the Swagger "servers"
  # entry) instead of http://, avoiding mixed-content "Failed to fetch" errors.
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: DEBUG
    com.shecancode.attendence.Attendence.Kafka: DEBUG