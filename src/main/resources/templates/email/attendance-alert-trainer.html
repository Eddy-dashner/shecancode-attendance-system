<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Attendance alert</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;color:#333333;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
                <tr>
                    <td style="background-color:#0f766e;padding:24px 32px;color:#ffffff;font-size:20px;font-weight:bold;"
                        th:text="${appName}">SheCanCODE</td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h1 style="font-size:22px;margin:0 0 16px;">
                            Hello <span th:text="${trainerName}">Trainer</span>, a student needs follow-up.
                        </h1>
                        <p style="font-size:15px;line-height:1.6;margin:0 0 16px;">
                            <strong th:text="${studentName}">Student Name</strong> in
                            <strong th:text="${programName}">Backend</strong>
                            (<span th:text="${cohortNumber}">Cohort-10</span>) has reached the absence limit:
                        </p>
                        <ul style="font-size:15px;line-height:1.6;margin:0 0 16px;padding-left:20px;">
                            <li th:each="reason : ${reasons}" th:text="${reason}">3 absences in a row (as of 2026-03-04)</li>
                        </ul>
                        <p style="font-size:15px;line-height:1.6;margin:0 0 16px;">
                            The student has been notified by email. Please check in with them.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px;background-color:#f5faf9;font-size:12px;color:#999;"
                        th:text="'© ' + ${appName} + ' — Need help? Reply to this email.'">
                        © SheCanCODE — Need help? Reply to this email.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
